<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Perbandingan kasus kanker baru dunia tahun 2022 dan proyeksi 2050</title>
  <desc id="desc">Diagram menunjukkan 20 juta kasus baru pada 2022 dan proyeksi lebih dari 35 juta pada 2050, atau kenaikan 77 persen.</desc>
  <rect width="1200" height="675" fill="#f1eadc"/>
  <path d="M0 0h1200v22H0z" fill="#b08a3e"/>
  <g fill="#10233b">
    <text x="80" y="105" font-family="Georgia,serif" font-size="42">Beban kanker dunia terus bertambah</text>
    <text x="80" y="145" font-family="Arial,sans-serif" font-size="20" fill="#526173">Kasus baru per tahun · estimasi dan proyeksi IARC</text>
  </g>
  <g font-family="Arial,sans-serif">
    <line x1="110" y1="530" x2="1090" y2="530" stroke="#b9ad98" stroke-width="2"/>
    <rect x="225" y="330" width="260" height="200" rx="5" fill="#617c6b"/>
    <rect x="705" y="180" width="260" height="350" rx="5" fill="#b08a3e"/>
    <text x="355" y="300" text-anchor="middle" font-size="58" font-weight="700" fill="#10233b">20 juta</text>
    <text x="835" y="150" text-anchor="middle" font-size="58" font-weight="700" fill="#10233b">35+ juta</text>
    <text x="355" y="575" text-anchor="middle" font-size="25" font-weight="700" fill="#10233b">2022</text>
    <text x="835" y="575" text-anchor="middle" font-size="25" font-weight="700" fill="#10233b">2050</text>
    <rect x="487" y="235" width="226" height="76" rx="38" fill="#fffaf1" stroke="#b08a3e" stroke-width="2"/>
    <text x="600" y="283" text-anchor="middle" font-size="31" font-weight="700" fill="#805f20">+77%</text>
    <text x="80" y="635" font-size="16" fill="#526173">Sumber: IARC Global Cancer Observatory · GLOBOCAN 2022</text>
  </g>
</svg>
